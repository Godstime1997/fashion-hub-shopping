function addFromDetail(){var p=P[curIdx];var key=p[1]+"|"+curColor+"|"+curSize;var f=null;for(var i=0;i<cart.length;i++){if(cart[i].key==key)f=cart[i];}if(f)f.qty++;else cart.push({key:key,name:p[1],color:curColor,size:curSize,price:p[2],img:curImg,qty:1});updateCart();closeDetail();alert(p[1]+" ("+curColor+", "+curSize+") added!");}

function closeDetail(){document.getElementById('detailModal').style.display='none';}
function getTotals(){var sub=0,cnt=0;for(var i=0;i<cart.length;i++){sub+=cart[i].price*cart[i].qty;cnt+=cart[i].qty;}var loc=document.getElementById('cLocation').value;var fee=loc=="PH"?2000:loc=="Other"?4500:3500;return{sub:sub,cnt:cnt,fee:fee,grand:sub+fee};}

function del(i){cart.splice(i,1);updateCart();}

function closeCart(){document.getElementById('cartModal').style.display='none';}

function searchP(){var q=document.getElementById('search').value.toLowerCase();if(!q)cur=P;else{cur=[];for(var i=0;i<P.length;i++){if(P[i][1].toLowerCase().indexOf(q)>-1)cur.push(P[i]);}}show(cur);}
function checkoutWhatsApp(){if(cart.length==0){alert("Cart empty");return;}var t=getTotals();var m="Hello, I want: ";for(var i=0;i<cart.length;i++){m+=cart[i].name+" ("+cart[i].color+", "+cart[i].size+") x"+cart[i].qty+", ";}m+=" TOTAL: ₦"+t.grand.toLocaleString();window.open("https://wa.me/2349037002209?text="+encodeURIComponent(m));}
