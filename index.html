<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion Hub - Spin & Win</title>
<style>
body{font-family:Arial;margin:0;background:#111;color:#fff;text-align:center}
.top{background:#fb7701;padding:12px;font-weight:900;font-size:20px}
.top span{color:#000}
h1{margin:10px 0 0;font-size:26px}
p{color:#ccc;font-size:14px}
.wheel-wrap{position:relative;width:310px;height:310px;margin:15px auto}
#wheel{width:310px;height:310px;border-radius:50%;border:8px solid #fff;transition:transform 4s cubic-bezier(.17,.67,.21,1);position:relative;overflow:hidden;background:#000}
.seg{position:absolute;width:50%;height:50%;top:0;left:50%;transform-origin:0 100%;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;font-weight:900;font-size:13px;color:#fff;text-align:center}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:42px;z-index:10}
#spinBtn{background:#fb7701;color:#fff;border:none;padding:16px 40px;border-radius:30px;font-size:20px;font-weight:900;margin-top:10px}
#spinBtn:disabled{background:#666}
.result{background:#fff;color:#000;margin:15px;border-radius:16px;padding:16px;display:none}
.result h2{margin:0;color:#e60000}
.code{background:#000;color:#FFD700;padding:12px;border-radius:10px;font-size:22px;font-weight:900;letter-spacing:2px;margin:10px 0}
.btn{border:none;padding:14px;width:100%;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px}
.shop{background:#00c853;color:#fff}
.wa{background:#25D366;color:#fff}
.info{background:#222;margin:10px;border-radius:12px;padding:12px;font-size:13px;text-align:left}
.info b{color:#FFD700}
</style>
</head>
<body>
<div class="top">FASHION<span>HUB</span> 🎡 SPIN & WIN</div>
<h1>Spin & Win Discount!</h1>
<p>Spin once per day. Win discount, use am for shop!</p>
<div class="wheel-wrap">
<div class="pointer">🔻</div>
<div id="wheel"></div>
</div>
<button id="spinBtn" onclick="spin()">🎡 SPIN NOW</button>
<div class="result" id="result">
<h2 id="winTitle">🎉 YOU WIN!</h2>
<p id="winText"></p>
<div class="code" id="winCode"></div>
<p style="font-size:12px;color:#666">Screenshot this code or tap WhatsApp to claim</p>
<button class="btn shop" onclick="goShop()">🛍️ SHOP NOW WITH DISCOUNT</button>
<button class="btn wa" onclick="claimWA()">💬 CLAIM ON WHATSAPP</button>
</div>
<div class="info">
<b>🏆 PRIZES:</b><br>
🎉 50% OFF - Jackpot!<br>
🎉 20% OFF<br>
🎉 10% OFF<br>
🎉 5% OFF<br>
🚚 FREE DELIVERY<br>
😢 Try Again
</div>
<script>
var prizes=[
{label:"50% OFF",color:"#e60000",code:"FH50"},
{label:"10% OFF",color:"#fb7701",code:"FH10"},
{label:"TRY AGAIN",color:"#333",code:""},
{label:"20% OFF",color:"#00a651",code:"FH20"},
{label:"5% OFF",color:"#0066ff",code:"FH05"},
{label:"FREE DELIVERY",color:"#800080",code:"FHFREE"},
{label:"10% OFF",color:"#fb7701",code:"FH10"},
{label:"TRY AGAIN",color:"#333",code:""}
];
var wheel=document.getElementById('wheel');
var html="";
for(var i=0;i<prizes.length;i++){
var deg=i*(360/prizes.length);
html+='<div class="seg" style="background:'+prizes[i].color+';transform:rotate('+deg+'deg) skewY('+(90-(360/prizes.length))+'deg)"><span style="transform:skewY(-'+(90-(360/prizes.length))+'deg) rotate('+((360/prizes.length)/2)+'deg);display:block;width:80px">'+prizes[i].label+'</span></div>';
}
wheel.innerHTML=html;
var spinning=false,currentDeg=0;
function spin(){
if(spinning) return;
spinning=true;
document.getElementById('spinBtn').disabled=true;
document.getElementById('spinBtn').innerText="Spinning...";
document.getElementById('result').style.display='none';
// Make 50% hard to win - only 5% chance
var rand=Math.random();
var winIndex;
if(rand<0.05){winIndex=0;}
else if(rand<0.20){winIndex=3;}
else if(rand<0.45){winIndex=1;}
else if(rand<0.60){winIndex=4;}
else if(rand<0.75){winIndex=5;}
else if(rand<0.90){winIndex=2;}
else{winIndex=6;}
var segAngle=360/prizes.length;
var target=360*5 + (360 - (winIndex*segAngle + segAngle/2));
currentDeg+=target;
wheel.style.transform="rotate("+currentDeg+"deg)";
setTimeout(function(){
spinning=false;
document.getElementById('spinBtn').disabled=false;
document.getElementById('spinBtn').innerText="🎡 SPIN AGAIN";
var p=prizes[winIndex];
var res=document.getElementById('result');
res.style.display='block';
if(p.label=="TRY AGAIN"){
document.getElementById('winTitle').innerText="😢 TRY AGAIN!";
document.getElementById('winText').innerText="No wahala, spin again! Your luck dey come.";
document.getElementById('winCode').style.display='none';
}else{
document.getElementById('winTitle').innerText="🎉 YOU WIN "+p.label+"!";
document.getElementById('winText').innerText="You win "+p.label+" for Fashion Hub! Use this code when you checkout.";
var code=p.code+"-"+Math.floor(1000+Math.random()*9000);
document.getElementById('winCode').style.display='block';
document.getElementById('winCode').innerText=code;
window.lastCode=code;
window.lastPrize=p.label;
}
window.scrollTo(0,document.body.scrollHeight);
},4200);
}
function goShop(){
var code=window.lastCode||"";
window.location.href="index.html?discount="+code;
}
function claimWA(){
var code=window.lastCode||"";
var prize=window.lastPrize||"";
var msg="Hello Fashion Hub! I spin & win! 🎡 I win "+prize+" Code: "+code+" I want to use am now!";
window.open("https://wa.me/2349037002209?text="+encodeURIComponent(msg));
}
</script>
</body>
</html>
