<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion Hub</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{font-family:Arial;margin:0;background:#fff5f0}
header{background:#000;color:#fff;padding:14px;text-align:center}
header h1{margin:0} header p{color:#ffcc00;font-size:12px}
.search{padding:10px;text-align:center;background:#fff}
.search input{width:92%;padding:12px;border-radius:25px;border:1px solid #ddd}
.cat{text-align:center;padding:8px;overflow-x:auto;white-space:nowrap}
.cat button{padding:8px 12px;margin:2px;border:none;border-radius:20px;background:#000;color:#fff}
.cat button.active{background:#ff6600}
.bar{background:#ff6600;color:#fff;text-align:center;padding:8px;font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;padding-bottom:130px}
.card{background:#fff;border-radius:12px;padding:9px;text-align:center}
.card img{width:100%;height:190px;object-fit:cover;border-radius:10px}
.card h3{font-size:13px;margin:6px 0}
.card p{color:#e60000;font-weight:bold}
.card button{background:#000;color:#fff;border:none;padding:8px;width:100%;border-radius:20px;font-weight:bold}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#000;color:#fff;padding:12px;text-align:center}
.cart-bar button{background:#ffcc00;border:none;padding:10px 14px;border-radius:20px;font-weight:bold}
.cart-bar button.pay{background:#00c853;color:#fff}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);overflow-y:auto}
.box{background:#fff;margin:12px;border-radius:15px;padding:15px}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.grand{background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;font-size:18px}
.pay-btn{background:#00c853;color:#fff;border:none;padding:15px;width:100%;border-radius:12px;font-weight:bold;font-size:17px}
.wa-btn{background:#25D366;color:#fff;border:none;padding:12px;width:100%;border-radius:12px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<header><h1>👗 FASHION HUB</h1><p>Real Clothes - Correct Pictures | WhatsApp: 09037002209</p></header>
<div class="search"><input id="search" placeholder="Search... Agbada, Gown, Hoodie" onkeyup="searchP()"></div>
<div class="cat">
<button onclick="filterCat('all',this)" class="active">All</button>
<button onclick="filterCat('men',this)">Men</button>
<button onclick="filterCat('women',this)">Women</button>
<button onclick="filterCat('native',this)">Native</button>
<button onclick="filterCat('kids',this)">Kids</button>
<button onclick="filterCat('shoes',this)">Shoes</button>
<button onclick="filterCat('bags',this)">Bags</button>
</div>
<div class="bar"><span id="totalCount">0</span> Clothes - Real Pictures</div>
<div class="products" id="products"></div>
<div class="cart-bar">🛒 <span id="count">0</span> | TOTAL: ₦<span id="total">0</span><br><button onclick="openCart()">View Cart</button> <button class="pay" onclick="openCart()">💳 Pay Now</button></div>
<div class="modal" id="cartModal"><div class="box">
<button onclick="closeCart()" style="float:right;background:#000;color:#fff;border:none;padding:8px 14px;border-radius:20px">X Close</button>
<h2>🛒 Your Cart</h2><div id="cartList"></div>
<p>Subtotal: ₦<b id="subTotal">0</b></p><p>Delivery: ₦<b id="deliveryFee">2,000</b></p>
<div class="grand">TOTAL: ₦<span id="grandTotal">0</span></div><br>
<input id="cName" placeholder="Full Name *"><input id="cPhone" placeholder="Phone *"><input id="cEmail" placeholder="Email *"><input id="cAddress" placeholder="Address *">
<select id="cLocation" onchange="renderCart()"><option value="PH">Port Harcourt - ₦2,000</option><option value="Lagos">Lagos - ₦3,500</option><option value="Abuja">Abuja - ₦3,500</option><option value="Other">Other - ₦4,500</option></select>
<button class="pay-btn" onclick="payWithPaystack()">💳 PAY ₦<span id="payBtnTotal">0</span> NOW</button>
<button class="wa-btn" onclick="checkoutWhatsApp()">💬 WhatsApp Order</button>
</div></div>
<script>
var KEY="pk_live_522e90bc4d7ec45abe67ed9b807d7512a0d8ce5b";
var P=[
["men","Oversized T-Shirt",9500,"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"],
["men","Baggy Cargo Jeans",18000,"https://images.unsplash.com/photo-1542272604-787c3835535d?w=500"],

["men","Blazer / Suit",35000,"https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=500"],
["men","Corporate Shirt",14000,"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500"],
["men","Denim Jacket",20000,"https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=500"],
["women","Bodycon Gown",19000,"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500"],
["women","Ankara Gown",22000,"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=500"],

["women","Jumpsuit",21000,"https://images.unsplash.com/photo-1509631179647-0177331693ae?w=500"],
["women","Summer Dress",16000,"https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500"],
["women","Sequin Party Gown",28000,"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500"],
["women","Abaya",25000,"https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=500"],
["women","Lace Gown",30000,"https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500"],
["native","Senator Wear",25000,"https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=500"],
["native","Kaftan Men",28000,"https://images.unsplash.com/photo-1603252109303-2751441dd157?w=500"],
["native","Ankara Skirt & Blouse",20000,"https://images.unsplash.com/photo-1551163943-3f6a855d1153?w=500"],
["native","Aso-Oke Set",40000,"https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=500"],
["kids","Boys Set",11000,"https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?w=500"],

["shoes","Nike Sneakers",28000,"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"],
["shoes","Ladies Heels",21000,"https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500"],
["shoes","White Sneakers",24000,"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"],
["shoes","Men Loafers",23000,"https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=500"],
["shoes","Slides",8000,"https://images.unsplash.com/photo-1603487742131-4160ec999306?w=500"],
["shoes","Running Shoes",26000,"https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=500"],
["bags","Ladies Handbag",15000,"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"],

];
var cart=[]; var cur=P;
document.getElementById('totalCount').innerText=P.length;
function show(list){var h="";for(var i=0;i<list.length;i++){var p=list[i];h+='<div class="card"><img src="'+p[3]+'"><h3>'+p[1]+'</h3><p>₦'+p[2].toLocaleString()+'</p><button onclick="addToCart('+P.indexOf(p)+')">Add to Cart</button></div>';}document.getElementById('products').innerHTML=h;}
function addToCart(idx){var p=P[idx];var f=null;for(var i=0;i<cart.length;i++){if(cart[i].name==p[1]){f=cart[i];}}if(f){f.qty++;}else{cart.push({name:p[1],price:p[2],img:p[3],qty:1});}updateCart();alert(p[1]+" added!");}
function getTotals(){var sub=0,cnt=0;for(var i=0;i<cart.length;i++){sub+=cart[i].price*cart[i].qty;cnt+=cart[i].qty;}var loc=document.getElementById('cLocation').value;var fee=loc=="PH"?2000:loc=="Other"?4500:3500;return{sub:sub,cnt:cnt,fee:fee,grand:sub+fee};}
function updateCart(){var t=getTotals();document.getElementById('count').innerText=t.cnt;document.getElementById('total').innerText=t.sub.toLocaleString();renderCart();}
function renderCart(){var t=getTotals();document.getElementById('subTotal').innerText=t.sub.toLocaleString();document.getElementById('deliveryFee').innerText=t.fee.toLocaleString();document.getElementById('grandTotal').innerText=t.grand.toLocaleString();document.getElementById('payBtnTotal').innerText=t.grand.toLocaleString();if(cart.length==0){document.getElementById('cartList').innerHTML="<p>Cart empty</p>";return;}var h="";for(var i=0;i<cart.length;i++){var x=cart[i];h+='<div style="display:flex;gap:10px;border-bottom:1px solid #eee;padding:8px 0"><img src="'+x.img+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px"><div style="flex:1"><b>'+x.name+'</b><br>₦'+x.price.toLocaleString()+' x '+x.qty+' = ₦'+(x.price*x.qty).toLocaleString()+'<br><button onclick="chg('+i+',-1)">-</button> '+x.qty+' <button onclick="chg('+i+',1)">+</button> <button onclick="del('+i+')" style="color:red;border:none;background:none">🗑</button></div></div>';}document.getElementById('cartList').innerHTML=h;}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart();}
function del(i){cart.splice(i,1);updateCart();}
function openCart(){renderCart();document.getElementById('cartModal').style.display='block';}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function filterCat(c,btn){var btns=document.querySelectorAll('.cat button');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');btn.classList.add('active');if(c=='all'){cur=P;}else{cur=[];for(var i=0;i<P.length;i++){if(P[i][0]==c)cur.push(P[i]);}}show(cur);}
function searchP(){var q=document.getElementById('search').value.toLowerCase();if(!q){cur=P;}else{cur=[];for(var i=0;i<P.length;i++){if(P[i][1].toLowerCase().indexOf(q)>-1)cur.push(P[i]);}}show(cur);}
function checkoutWhatsApp(){if(cart.length==0){alert("Cart empty");return;}var t=getTotals();var msg="Hello Fashion Hub, I want: ";for(var i=0;i<cart.length;i++){msg+=cart[i].name+" x"+cart[i].qty+", ";}msg+=" TOTAL: ₦"+t.grand.toLocaleString();window.open("https://wa.me/2349037002209?text="+encodeURIComponent(msg));}
function payWithPaystack(){if(cart.length==0){alert("Cart empty");return;}var name=document.getElementById('cName').value,email=document.getElementById('cEmail').value,phone=document.getElementById('cPhone').value,addr=document.getElementById('cAddress').value;if(!name||!email||!phone||!addr){alert("Fill Name, Phone, Email, Address");return;}var t=getTotals();var h=PaystackPop.setup({key:KEY,email:email,amount:t.grand*100,currency:"NGN",ref:"FH-"+Math.floor(Math.random()*1000000000),callback:function(res){alert("✅ Payment Successful! Ref: "+res.reference);var msg="NEW PAID ORDER! Ref: "+res.reference+" Name: "+name+" Phone: "+phone+" Address: "+addr+" TOTAL: ₦"+t.grand.toLocaleString();window.open("https://wa.me/2349037002209?text="+encodeURIComponent(msg));cart=[];updateCart();closeCart();},onClose:function(){alert("Payment cancelled");}});h.openIframe();}
show(P);
</script>
</body>
</html>
