<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion Hub - Choose Your Colour</title>
<style>
body{font-family:Arial;margin:0;background:#fff5f0}
header{background:#000;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:24px}
header p{margin:4px;color:#ffcc00;font-size:13px}
.search{padding:10px;text-align:center;background:#fff}
.search input{width:92%;padding:12px;border:1px solid #ddd;border-radius:25px}
.cat{padding:10px;text-align:center;overflow-x:auto;white-space:nowrap}
.cat button{padding:9px 14px;margin:3px;border:none;border-radius:20px;background:#000;color:#fff;font-size:13px}
.cat button.active{background:#ff6600}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;padding-bottom:130px}
.card{background:#fff;border-radius:12px;padding:9px;text-align:center}
.card img{width:100%;height:170px;object-fit:cover;border-radius:10px}
.card h3{font-size:13px;margin:7px 0 2px}
.badge{background:#ff6600;color:#fff;font-size:10px;padding:3px 8px;border-radius:10px}
.card p{color:#e60000;font-weight:bold;margin:4px}
.card del{color:#999;font-size:11px}
.colors{display:flex;justify-content:center;gap:5px;margin:6px 0;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;border:2px solid #ddd;cursor:pointer}
.color-dot.selected{border:3px solid #000;transform:scale(1.15)}
.color-name{font-size:11px;color:#555;margin:2px}
.card button.add{background:#000;color:#fff;border:none;padding:9px;width:100%;border-radius:20px;font-weight:bold}
.cart{position:fixed;bottom:0;left:0;right:0;background:#000;color:#fff;padding:13px;text-align:center;font-size:14px}
.cart button{background:#ffcc00;border:none;padding:11px 18px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<header><h1>👗 FASHION HUB</h1><p>🔥 120+ LATEST 2026 | Choose Your Colour | Port Harcourt</p><p>📞 WhatsApp: 09037002209</p></header>
<div class="search"><input type="text" id="search" placeholder="Search... gown, cargo, hoodie, ankara" onkeyup="searchP()"></div>
<div class="cat">
<button onclick="filterCat('all',this)" class="active">All</button>
<button onclick="filterCat('men',this)">Men</button>
<button onclick="filterCat('women',this)">Women</button>
<button onclick="filterCat('kids',this)">Kids</button>
<button onclick="filterCat('shoes',this)">Shoes</button>
<button onclick="filterCat('bags',this)">Bags</button>
<button onclick="filterCat('accessories',this)">Accessories</button>
</div>
<div class="products" id="products"></div>
<div class="cart">🛒 <span id="count">0</span> | ₦<span id="total">0</span> <button onclick="checkout()">CHECKOUT ON WHATSAPP</button></div>
<script>
let base=[

{name:"Crop Top + Skirt",cat:"women",img:"https://images.unsplash.com/photo-1551163943-3f6a855d1153?w=500",price:14000,colors:["White","Black","Pink","Lilac"]},

{name:"Face Cap",cat:"accessories",img:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500",price:7000,colors:["Black","White","Red","Blue"]},
{name:"Necklace Set",cat:"accessories",img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500",price:9000,colors:["Gold","Silver","Rose Gold"]},
];
let products=base.map((b,i)=>({...b, old:b.price+6000, tag:["NEW","HOT","TRENDING","PREMIUM"][i%4], id:i}));
let selected={};
let colorHex={Black:"#000",White:"#fff",Red:"#e60000",Blue:"#0066ff",Green:"#00a651",Brown:"#8B4513",Grey:"#888",Beige:"#E8DCC8",Pink:"#FFC0CB",Wine:"#722F37",Navy:"#000080",Olive:"#808000",Yellow:"#FFD700",Purple:"#800080",Lilac:"#C8A2C8",Khaki:"#C3B091",Nude:"#E3BC9A",Gold:"#FFD700",Silver:"#C0C0C0","Rose Gold":"#E0BF8C","Light Blue":"#ADD8E6",Multi:"linear-gradient(45deg,red,yellow,green,blue)"};
function colorStyle(c){let h=colorHex[c]||"#ccc"; if(h.includes("gradient")) return `background:${h}`; return `background:${h}`;}
let cart=[], total=0;
function show(list){
  document.getElementById('products').innerHTML=list.map(p=>{
    if(!selected[p.id]) selected[p.id]=p.colors[0];
    let dots=p.colors.map(c=>`<div class="color-dot ${selected[p.id]==c?'selected':''}" style="${colorStyle(c)}" onclick="pickColor(${p.id},'${c}',this)"></div>`).join('');
    return `<div class="card"><img src="${p.img}"><br><span class="badge">${p.tag}</span><h3>${p.name}</h3><small>Size: S, M, L, XL, XXL</small><div class="color-name">Colour: <b id="cn-${p.id}">${selected[p.id]}</b></div><div class="colors">${dots}</div><p>₦${p.price.toLocaleString()} <del>₦${p.old.toLocaleString()}</del></p><button class="add" onclick="add(${p.price},'${p.name}',${p.id})">Add to Cart</button></div>`
  }).join('');
}
function pickColor(id,color,el){ selected[id]=color; document.getElementById('cn-'+id).innerText=color; el.parentElement.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected')); el.classList.add('selected'); }
function add(price,name,id){let col=selected[id]||"Black"; cart.push(name+" ("+col+")"); total+=price; document.getElementById('count').innerText=cart.length; document.getElementById('total').innerText=total.toLocaleString(); alert(name+" - "+col+" added!"); }
function filterCat(c,btn){document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');show(c=='all'?products:products.filter(p=>p.cat==c));}
function searchP(){let q=document.getElementById('search').value.toLowerCase();show(products.filter(p=>p.name.toLowerCase().includes(q)))}
function checkout(){if(cart.length==0){alert("Cart empty!");return;}let msg="Hello Fashion Hub, I want to order: "+cart.join(", ")+" Total: ₦"+total.toLocaleString();window.open("https://wa.me/2349037002209?text="+encodeURIComponent(msg));}
show(products);
</script>
</body>
</html>
