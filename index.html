var cart=[],cur=P,selC={},selS={};

function show(list){var h="";for(var i=0;i<list.length;i++){var p=list[i];var idx=P.indexOf(p);if(!selC[idx])selC[idx]=p[4].split(",")[0];if(!selS[idx])selS[idx]="M";var cols=p[4].split(",");var dots="";for(var k=0;k<cols.length;k++){dots+='<div class="dot '+(selC[idx]==cols[k]?'sel':'')+'" style="background:'+(C[cols[k]]||'#ccc')+'" onclick="pickC('+idx+',\''+cols[k]+'\')"></div>';}var sz="";for(var s=0;s<SIZES.length;s++){sz+='<div class="sz '+(selS[idx]==SIZES[s]?'sel':'')+'" onclick="pickS('+idx+',\''+SIZES[s]+'\')">'+SIZES[s]+'</div>';}h+='<div class="card"><img src="https://images.unsplash.com/'+p[3]+'?w=500"><span class="badge">NEW</span><h3>'+p[1]+'</h3><div class="lab">Colour: <b>'+selC[idx]+'</b></div><div class="dots">'+dots+'</div><div class="lab">Size: <b>'+selS[idx]+'</b></div><div class="sizes">'+sz+'</div><p>₦'+p[2].toLocaleString()+' <del>₦'+(p[2]+6000).toLocaleString()+'</del></p><button class="add" onclick="addToCart('+idx+')">Add to Cart</button></div>';}document.getElementById('products').innerHTML=h;}
function pickC(idx,col){selC[idx]=col;show(cur);}

function addToCart(idx){var p=P[idx];var col=selC[idx]||"M";var sz=selS[idx]||"M";var key=p[1]+"|"+col+"|"+sz;var f=null;for(var i=0;i<cart.length;i++){if(cart[i].key==key)f=cart[i];}if(f)f.qty++;else cart.push({key:key,name:p[1],color:col,size:sz,price:p[2],img:"https://images.unsplash.com/"+p[3]+"?w=500",qty:1});updateCart();alert(p[1]+" - "+col+" - Size "+sz+" added!");}
function getTotals(){var sub=0,cnt=0;for(var i=0;i<cart.length;i++){sub+=cart[i].price*cart[i].qty;cnt+=cart[i].qty;}var loc=document.getElementById('cLocation').value;var fee=loc=="PH"?2000:loc=="Other"?4500:3500;return{sub:sub,cnt:cnt,fee:fee,grand:sub+fee};}
function updateCart(){var t=getTotals();document.getElementById('count').innerText=t.cnt;document.getElementById('total').innerText=t.sub.toLocaleString();renderCart();}
function renderCart(){var t=getTotals();document.getElementById('subTotal').innerText=t.sub.toLocaleString();document.getElementById('deliveryFee').innerText=t.fee.toLocaleString();document.getElementById('grandTotal').innerText=t.grand.toLocaleString();document.getElementById('payBtnTotal').innerText=t.grand.toLocaleString();if(cart.length==0){document.getElementById('cartList').innerHTML="<p>Cart empty</p>";return;}var h="";for(var i=0;i<cart.length;i++){var x=cart[i];h+='<div style="display:flex;gap:10px;border-bottom:1px solid #eee;padding:8px 0"><img src="'+x.img+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px"><div style="flex:1"><b>'+x.name+'</b><br>'+x.color+' | Size '+x.size+' | ₦'+x.price.toLocaleString()+'<br><button onclick="chg('+i+',-1)">-</button> '+x.qty+' <button onclick="chg('+i+',1)">+</button> <button onclick="del('+i+')" style="color:red;border:none;background:none">🗑</button></div><b>₦'+(x.price*x.qty).toLocaleString()+'</b></div>';}document.getElementById('cartList').innerHTML=h;}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart();}
function del(i){cart.splice(i,1);updateCart();}
function openCart(){renderCart();document.getElementById('cartModal').style.display='block';}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function filterCat(c,btn){var b=document.querySelectorAll('.cat button');for(var i=0;i<b.length;i++)b[i].classList.remove('active');btn.classList.add('active');if(c=='all')cur=P;else{cur=[];for(var i=0;i<P.length;i++){if(P[i][0]==c)cur.push(P[i]);}}show(cur);}
function searchP(){var q=document.getElementById('search').value.toLowerCase();if(!q)cur=P;else{cur=[];for(var i=0;i<P.length;i++){if(P[i][1].toLowerCase().indexOf(q)>-1)cur.push(P[i]);}}show(cur);}
function checkoutWhatsApp(){if(cart.length==0){alert("Cart empty");return;}var t=getTotals();var m="Hello Fashion Hub, I want: ";for(var i=0;i<cart.length;i++){m+=cart[i].name+" ("+cart[i].color+", Size "+cart[i].size+") x"+cart[i].qty+", ";}m+=" TOTAL: ₦"+t.grand.toLocaleString();window.open("https://wa.me/2349037002209?text="+encodeURIComponent(m));}
function payWithPaystack(){if(cart.length==0){alert("Cart empty");return;}var name=document.getElementById('cName').value,email=document.getElementById('cEmail').value,phone=document.getElementById('cPhone').value,addr=document.getElementById('cAddress').value;if(!name||!email||!phone||!addr){alert("Fill Name, Phone, Email, Address");return;}var t=getTotals();var h=PaystackPop.setup({key:KEY,email:email,amount:t.grand*100,currency:"NGN",ref:"FH-"+Math.floor(Math.random()*1000000000),callback:function(res){alert("✅ Payment Successful! Ref: "+res.reference);var m="NEW PAID ORDER! Ref: "+res.reference+" Name: "+name+" Phone: "+phone+" Address: "+addr+" Order: ";for(var i=0;i<cart.length;i++){m+=cart[i].name+" ("+cart[i].color+", "+cart[i].size+") x"+cart[i].qty+", ";}m+=" TOTAL: ₦"+t.grand.toLocaleString();window.open("https://wa.me/2349037002209?text="+encodeURIComponent(m));cart=[];updateCart();closeCart();},onClose:function(){alert("Payment cancelled");}});h.openIframe();}
