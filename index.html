function openCart(){renderCart();document.getElementById('cartModal').style.display='block';}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function filterCat(c,btn){var b=document.querySelectorAll('.cat button');for(var i=0;i<b.length;i++)b[i].classList.remove('active');btn.classList.add('active');curCat=c;applyFilters();}
function searchP(){var q=document.getElementById('search').value.toLowerCase();if(!q){applyFilters();return;}cur=[];for(var i=0;i<P.length;i++){if((P[i][0]+" "+P[i][2]).toLowerCase().indexOf(q)>-1)cur.push(P[i]);}show(cur);}
function checkoutWhatsApp(){if(cart.length==0){alert("Cart empty");return;}var t=getTotals();var m="Hello, I want: ";for(var i=0;i<cart.length;i++){m+=cart[i].name+" ("+cart[i].color+", "+cart[i].size+") x"+cart[i].qty+", ";}m+=" TOTAL: ₦"+t.grand.toLocaleString();window.open("https://wa.me/2349037002209?text="+encodeURIComponent(m));}
function payWithPaystack(){if(cart.length==0){alert("Cart empty");return;}var name=document.getElementById('cName').value,email=document.getElementById('cEmail').value,phone=document.getElementById('cPhone').value,addr=document.getElementById('cAddress').value;if(!name||!email||!phone||!addr){alert("Fill all fields");return;}var t=getTotals();var h=PaystackPop.setup({key:KEY,email:email,amount:t.grand*100,currency:"NGN",ref:"FH-"+Math.floor(Math.random()*1000000000),callback:function(res){alert("Payment Successful! "+res.reference);cart=[];updateCart();closeCart();},onClose:function(){alert("Payment cancelled");}});h.openIframe();}
renderBrands();show(P);
</script>
